<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 680" role="img" aria-labelledby="title desc">
  <title id="title">sharkipediaR data pipeline</title>
  <desc id="desc">Species pages flow through fetch, parse, clean, and sp functions into tidyverse analysis.</desc>

  <defs>
    <pattern id="denticles" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <circle cx="5" cy="5" r="1.4" fill="#1e3d52" opacity="0.4"/>
      <circle cx="14" cy="13" r="1.1" fill="#2a5570" opacity="0.32"/>
      <ellipse cx="12" cy="4" rx="1.8" ry="0.9" fill="#163040" opacity="0.26"/>
    </pattern>

    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081824"/>
      <stop offset="40%" stop-color="#0f2840"/>
      <stop offset="100%" stop-color="#143550"/>
    </linearGradient>

    <linearGradient id="boxSharkipedia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3589ad"/>
      <stop offset="100%" stop-color="#1a4d68"/>
    </linearGradient>

    <linearGradient id="boxPackage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a9488"/>
      <stop offset="100%" stop-color="#265a50"/>
    </linearGradient>

    <linearGradient id="boxScience" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a7358"/>
      <stop offset="100%" stop-color="#4a3f32"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ec8e8"/>
      <stop offset="100%" stop-color="#a8e8d8"/>
    </linearGradient>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#9ed8ec"/>
    </marker>
  </defs>

  <rect width="1920" height="680" rx="24" fill="url(#oceanBg)"/>
  <rect width="1920" height="680" rx="24" fill="url(#denticles)"/>
  <rect width="1920" height="680" rx="24" fill="url(#oceanBg)" opacity="0.5"/>

  <!-- Side margin notes -->
  <text x="56" y="120" fill="#6a9ab8" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">public HTML</text>
  <text x="56" y="148" fill="#6a9ab8" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">species pages</text>

  <text x="1780" y="120" text-anchor="end" fill="#7ec8b0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">rate-limited</text>
  <text x="1780" y="148" text-anchor="end" fill="#7ec8b0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">session cache</text>

  <text x="1780" y="400" text-anchor="end" fill="#7ec8b0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">provenance</text>
  <text x="1780" y="428" text-anchor="end" fill="#7ec8b0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">on every row</text>

  <text x="56" y="400" fill="#c9b896" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">reproducible</text>
  <text x="56" y="428" fill="#c9b896" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic">tibbles in R</text>

  <!-- Zone headers -->
  <text x="200" y="56" fill="#9ec8e0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em">SHARKIPEDIA</text>
  <text x="620" y="56" fill="#a8e8d8" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.04em">sharkipediaR</text>
  <text x="200" y="620" fill="#e0d0b0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em">YOUR WORKFLOW</text>

  <!-- Row 1: left to right -->
  <g filter="url(#softGlow)">
    <rect x="120" y="100" width="340" height="120" rx="16" fill="url(#boxSharkipedia)" stroke="#8ec8e8" stroke-width="2"/>
    <text x="290" y="158" text-anchor="middle" fill="#f0faff" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Species pages</text>
    <text x="290" y="196" text-anchor="middle" fill="#c8e8f4" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20">traits &#183; trends &#183; refs</text>

    <rect x="520" y="100" width="340" height="120" rx="16" fill="url(#boxPackage)" stroke="#9ee8d8" stroke-width="2"/>
    <text x="690" y="168" text-anchor="middle" fill="#f4fffa" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">fetch_page</text>
    <text x="690" y="206" text-anchor="middle" fill="#c8f0e4" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">polite HTTP &#183; cached</text>

    <rect x="920" y="100" width="400" height="120" rx="16" fill="url(#boxPackage)" stroke="#9ee8d8" stroke-width="2"/>
    <text x="1120" y="158" text-anchor="middle" fill="#f4fffa" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Parse HTML &amp; charts</text>
    <text x="1120" y="196" text-anchor="middle" fill="#c8f0e4" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20">tables &#183; trend time series</text>
  </g>

  <!-- Row 2: right to left (snake) -->
  <g filter="url(#softGlow)">
    <rect x="920" y="400" width="400" height="120" rx="16" fill="url(#boxPackage)" stroke="#9ee8d8" stroke-width="2"/>
    <text x="1120" y="458" text-anchor="middle" fill="#f4fffa" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Clean &amp; validate</text>
    <text x="1120" y="496" text-anchor="middle" fill="#c8f0e4" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20">source_url &#183; retrieved_at</text>

    <rect x="480" y="400" width="400" height="120" rx="16" fill="url(#boxPackage)" stroke="#9ee8d8" stroke-width="2"/>
    <text x="680" y="448" text-anchor="middle" fill="#f4fffa" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">sp_species &#183; sp_traits</text>
    <text x="680" y="484" text-anchor="middle" fill="#f4fffa" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">sp_trends &#183; sp_references</text>

    <rect x="120" y="400" width="340" height="120" rx="16" fill="url(#boxScience)" stroke="#dcc8a0" stroke-width="2"/>
    <text x="290" y="458" text-anchor="middle" fill="#fffaf2" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">tidyverse analysis</text>
    <text x="290" y="496" text-anchor="middle" fill="#f0e4cc" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20">plots &#183; models &#183; exports</text>
  </g>

  <!-- Arrows -->
  <path d="M 462 160 L 508 160" stroke="url(#arrowGrad)" stroke-width="5" fill="none" marker-end="url(#arrowHead)"/>
  <path d="M 862 160 L 908 160" stroke="url(#arrowGrad)" stroke-width="5" fill="none" marker-end="url(#arrowHead)"/>
  <path d="M 1120 222 C 1120 290 1120 320 1120 388" stroke="url(#arrowGrad)" stroke-width="5" fill="none" marker-end="url(#arrowHead)"/>
  <path d="M 918 460 L 882 460" stroke="url(#arrowGrad)" stroke-width="5" fill="none" marker-end="url(#arrowHead)"/>
  <path d="M 478 460 L 462 460" stroke="url(#arrowGrad)" stroke-width="5" fill="none" marker-end="url(#arrowHead)"/>

  <!-- Fin accents -->
  <path d="M 1820 72 Q 1868 108 1820 144 Q 1772 108 1820 72" fill="#1e4a62" opacity="0.45" stroke="#6aaccc" stroke-width="1"/>
  <path d="M 1840 520 Q 1888 556 1840 592 Q 1792 556 1840 520" fill="#1e4a62" opacity="0.3" stroke="#6aaccc" stroke-width="1"/>
</svg>
